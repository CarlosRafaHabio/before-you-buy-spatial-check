name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
      - name: Install package from source
        run: python -m pip install . --no-deps
      - name: Smoke-test installed package outside repository
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import version; import spatial_check; assert version('before-you-buy-spatial-check') == '0.3.1'; assert callable(spatial_check.evaluate)"
          python -m spatial_check --demo fits > spatial-check-demo.json
