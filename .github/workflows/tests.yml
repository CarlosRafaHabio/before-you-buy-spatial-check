name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build --wheel --sdist
      - name: Reproduce tests from extracted sdist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          SDIST_ROOT="$(find "$RUNNER_TEMP/sdist" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SDIST_ROOT"
          test -f "$SDIST_ROOT/prototypes/camel_selective_v0/closed_host_plan.py"
          test -f "$SDIST_ROOT/tests/test_camel_g4b_host_authority_witnesses.py"
          test -f "$SDIST_ROOT/security_isolation/test_h8_container_boundary.py"
          test -f "$SDIST_ROOT/security_fuzz/test_flow_security_properties.py"
          test -f "$SDIST_ROOT/security_monty/test_h10_differential.py"
          test -f "$SDIST_ROOT/security_monty/test_h12_fixed_bridge.py"
          test -f "$SDIST_ROOT/prototypes/camel_selective_v0/monty_host_bridge_v0.py"
          test -f "$SDIST_ROOT/prototypes/camel_selective_v0/isolated_broker_v0.py"
          test -f "$SDIST_ROOT/prototypes/camel_selective_v0/isolated_broker_worker_v0.py"
          test -f "$SDIST_ROOT/security_monty/test_h13_killable_broker.py"
          test -f "$SDIST_ROOT/prototypes/camel_selective_v0/durable_claim_v0.py"
          test -f "$SDIST_ROOT/security_monty/test_h14_durable_claim.py"
          cd "$SDIST_ROOT"
          python -m unittest discover -s tests -v
          mkdir -p "$RUNNER_TEMP/rebuilt-wheel"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/rebuilt-wheel"
      - name: Install rebuilt wheel in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/install-venv"
          PY="$RUNNER_TEMP/install-venv/bin/python"
          "$PY" -m pip install --no-deps "$RUNNER_TEMP"/rebuilt-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$PY" -c "import importlib.util,pathlib,zipfile; ws=list(pathlib.Path('$RUNNER_TEMP/rebuilt-wheel').glob('*.whl')); assert len(ws)==1; z=zipfile.ZipFile(ws[0]); names=z.namelist(); assert any(n.startswith('spatial_check/') for n in names); assert not any(n.startswith(('prototypes/','tests/','security_monty/','security_isolation/','security_fuzz/')) for n in names); assert importlib.util.find_spec('prototypes') is None"
          "$PY" -c "from importlib.metadata import version; import spatial_check; assert version('before-you-buy-spatial-check') == '0.3.1'; assert callable(spatial_check.evaluate)"
          "$PY" -m spatial_check --demo fits > "$RUNNER_TEMP/spatial-check-demo.json"
          "$PY" -c "import json, pathlib; d=json.loads(pathlib.Path('$RUNNER_TEMP/spatial-check-demo.json').read_text()); assert d['status'] == 'NO CONFLICT DETECTED IN PROVIDED DATA'; assert d['execution_mode'] == 'DEMO_ONLY'"
