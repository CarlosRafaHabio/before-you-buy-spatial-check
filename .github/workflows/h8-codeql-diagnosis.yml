name: H8 CodeQL remaining alert diagnostic

on:
  push:
    branches:
      - experiment/camel-selective-flow-guard-v0

permissions:
  contents: read
  checks: read

jobs:
  check-one-high:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect current CodeQL alert annotation (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/CarlosRafaHabio/before-you-buy-spatial-check/check-runs/113447912278/annotations" \
            --jq '.[] | {path, start_line, end_line, title, annotation_level, message}'
