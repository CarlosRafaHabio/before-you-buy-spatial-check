name: Experimental Security (isolated branch)

on:
  push:
    branches:
      - experiment/camel-selective-flow-guard-v0

permissions:
  contents: read

concurrency:
  group: security-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  properties-and-bandit:
    name: Hypothesis + Bandit (optional audit-only dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install audit-only packages
        run: python -m pip install "hypothesis>=6,<7" "bandit>=1.8,<2"
      - name: Security property fuzzing
        env:
          PYTHONHASHSEED: '0'
        run: python -m unittest discover -s security_fuzz -v
      - name: Static analysis of Python sources
        run: python -m bandit -r spatial_check prototypes/camel_selective_v0 -ll -ii -q

  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}

  github-actions-audit:
    name: zizmor workflow audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
