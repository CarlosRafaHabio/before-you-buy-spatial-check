name: H9 Pydantic Monty evaluation (experimental)

on:
  push:
    branches:
      - experiment/camel-selective-flow-guard-v0

permissions:
  contents: read

concurrency:
  group: h9-monty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monty:
    name: Off-the-shelf Monty isolated worker feasibility
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install optional upstream evaluator in ephemeral CI only
        run: |
          python -m pip install pydantic-monty
          python -m pip show pydantic-monty pydantic-monty-client pydantic-monty-runtime
      - name: Test Monty and existing host-scoped gate
        run: python -m unittest discover -s security_monty -p 'test_*.py' -v
